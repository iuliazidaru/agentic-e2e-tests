<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Demo App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .header {
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #333;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back {
            background-color: #9e9e9e;
            color: white;
        }
        .btn-back:hover {
            background-color: #757575;
        }
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            padding: 24px;
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn-place-order {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }
        .btn-place-order:hover {
            background-color: #45a049;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-name {
            color: #333;
            font-size: 14px;
        }
        .cart-item-price {
            color: #4CAF50;
            font-weight: bold;
        }
        .cart-empty {
            color: #888;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        @media (max-width: 600px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Checkout</h1>
        <a href="/products" class="btn btn-back">&larr; Back to Products</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"
         style="max-width:900px; margin: 0 auto 16px auto;"></div>

    <div class="checkout-container">
        <!-- Cart Summary -->
        <div class="card">
            <h2>Order Summary</h2>
            <div th:if="${#lists.isEmpty(cartProducts)}" class="cart-empty">
                <p>No items in cart. A default product will be ordered.</p>
            </div>
            <div th:each="product : ${cartProducts}" class="cart-item">
                <span class="cart-item-name" th:text="${product.name}">Product Name</span>
                <span class="cart-item-price" th:text="'$' + ${product.price}">$0.00</span>
            </div>
        </div>

        <!-- Shipping Information Form -->
        <div class="card">
            <h2>Shipping Information</h2>
            <form action="/order/place" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="productId" th:value="${selectedProductId}"/>

                <div class="form-group">
                    <label for="email-address">Email Address</label>
                    <input type="text"
                           id="email-address"
                           name="emailAddress"
                           placeholder="Enter your email address"
                           required/>
                </div>

                <div class="form-group">
                    <label for="shipping-address">Shipping Address</label>
                    <input type="text"
                           id="shipping-address"
                           name="shippingAddress"
                           placeholder="Enter your shipping address"
                           required/>
                </div>

                <button type="submit" id="place-order-btn" class="btn-place-order">
                    Place Order
                </button>
            </form>
        </div>
    </div>
</body>
</html>
